[project]
name = "feather"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "pydantic-ai==2.66.0",
    "pydantic-ai-harness[coder]==0.66.0",
]

[project.scripts]
feather = "feather:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly==1.4.1",
    "ruff==0.17.4",
]
